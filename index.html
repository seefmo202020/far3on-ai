<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>فرعون AI — شات، صور، فيديو وصوت</title>
<style>
  :root {
    --bg: #0b0f1a; --card: #131a2b; --card2: #1a2340; --line: #263156;
    --txt: #eef1ff; --muted: #8b94b8; --accent: #6c5ce7; --accent2: #00cec9;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: "Segoe UI", Tahoma, Arial, sans-serif;
    background: radial-gradient(1200px 600px at 80% -10%, #1c2650 0%, var(--bg) 55%);
    color: var(--txt); min-height: 100vh; display: flex; flex-direction: column;
  }
  header { padding: 18px 16px 10px; text-align: center; }
  header h1 { font-size: 26px; letter-spacing: .5px; }
  header h1 span { color: var(--accent2); }
  header p { color: var(--muted); font-size: 13px; margin-top: 4px; }
  nav {
    display: flex; gap: 8px; padding: 10px 12px; position: sticky; top: 0; z-index: 5;
    background: rgba(11,15,26,.85); backdrop-filter: blur(8px);
  }
  nav button {
    flex: 1; padding: 10px 4px; border: 1px solid var(--line); border-radius: 12px;
    background: var(--card); color: var(--muted); font-size: 14px; font-weight: 600; cursor: pointer;
  }
  nav button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  main { flex: 1; width: 100%; max-width: 760px; margin: 0 auto; padding: 12px 14px 90px; }
  section { display: none; }
  section.active { display: block; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
  textarea, select {
    width: 100%; background: var(--bg); color: var(--txt); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px; font-size: 15px; font-family: inherit; resize: vertical;
  }
  textarea:focus, select:focus { outline: 2px solid var(--accent); }
  .row { display: flex; gap: 8px; margin-top: 10px; }
  .btn {
    border: none; border-radius: 12px; padding: 12px 18px; font-size: 15px; font-weight: 700;
    background: linear-gradient(135deg, var(--accent), #8e7bff); color: #fff; cursor: pointer; flex: 1;
  }
  .btn:disabled { opacity: .5; }
  .status { margin-top: 10px; font-size: 13px; color: var(--muted); min-height: 18px; }
  .status.err { color: #ff7675; }
  .result { margin-top: 12px; }
  .result img, .result video { width: 100%; border-radius: 14px; border: 1px solid var(--line); display: block; }
  .result audio { width: 100%; margin-top: 6px; }
  .result a.dl {
    display: inline-block; margin-top: 8px; font-size: 13px; color: var(--accent2); text-decoration: none;
  }
  /* chat */
  #chatLog { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 16px; font-size: 15px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; }
  .msg.user { align-self: flex-start; background: var(--accent); color: #fff; border-bottom-left-radius: 4px; }
  .msg.bot { align-self: flex-end; background: var(--card2); border: 1px solid var(--line); border-bottom-right-radius: 4px; }
  .msg.bot.typing { color: var(--muted); font-style: italic; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 8px; }
  footer { text-align: center; color: var(--muted); font-size: 12px; padding: 14px; }
</style>
</head>
<body>
<header>
  <h1>فرعون <span>AI</span></h1>
  <p>اسأل أي سؤال · ولّد صور · ولّد فيديو · حوّل الكلام لصوت</p>
</header>

<nav>
  <button data-tab="chat" class="active">💬 شات</button>
  <button data-tab="image">🖼️ صور</button>
  <button data-tab="video">🎬 فيديو</button>
  <button data-tab="tts">🔊 صوت</button>
</nav>

<main>
  <!-- CHAT -->
  <section id="tab-chat" class="active">
    <div id="chatLog"></div>
    <div class="card">
      <textarea id="chatInput" rows="2" placeholder="اكتب سؤالك هنا..."></textarea>
      <div class="row"><button class="btn" id="chatSend">إرسال</button></div>
    </div>
  </section>

  <!-- IMAGE -->
  <section id="tab-image">
    <div class="card">
      <textarea id="imgPrompt" rows="3" placeholder="اوصف الصورة اللي عايزها... مثال: قطة بتلبس نظارة شمس على الشاطئ"></textarea>
      <div class="row"><button class="btn" id="imgGo">توليد الصورة</button></div>
      <div class="status" id="imgStatus"></div>
      <div class="result" id="imgResult"></div>
      <div class="hint">الصور بتتولد بموديل Z-Image Turbo وبتاخد ثواني.</div>
    </div>
  </section>

  <!-- VIDEO -->
  <section id="tab-video">
    <div class="card">
      <textarea id="vidPrompt" rows="3" placeholder="اوصف الفيديو... مثال: عربية بتعدي في شارع وسط المطر بالليل"></textarea>
      <div class="row"><button class="btn" id="vidGo">توليد الفيديو</button></div>
      <div class="status" id="vidStatus"></div>
      <div class="result" id="vidResult"></div>
      <div class="hint">الفيديو بياخد من دقيقة لعدة دقايق حسب الضغط على السيرفر.</div>
    </div>
  </section>

  <!-- TTS -->
  <section id="tab-tts">
    <div class="card">
      <textarea id="ttsText" rows="3" placeholder="اكتب الكلام اللي عايز تحوّله لصوت..."></textarea>
      <div class="row">
        <select id="ttsVoice">
          <option value="Ryan">Ryan (راجل)</option>
          <option value="Dylan">Dylan (راجل)</option>
          <option value="Eric">Eric (راجل)</option>
          <option value="Aiden">Aiden (راجل)</option>
          <option value="Uncle_Fu">Uncle Fu (راجل)</option>
          <option value="Vivian">Vivian (ست)</option>
          <option value="Serena">Serena (ست)</option>
          <option value="Ono_Anna">Ono Anna (ست)</option>
          <option value="Sohee">Sohee (ست)</option>
        </select>
      </div>
      <div class="row"><button class="btn" id="ttsGo">تحويل لصوت</button></div>
      <div class="status" id="ttsStatus"></div>
      <div class="result" id="ttsResult"></div>
    </div>
  </section>
</main>

<footer>مبني بـ SandBase API · DeepSeek V4.1 Flash</footer>

<script>
const $ = (id) => document.getElementById(id);

// Tabs
document.querySelectorAll("nav button").forEach(b => {
  b.onclick = () => {
    document.querySelectorAll("nav button").forEach(x => x.classList.remove("active"));
    document.querySelectorAll("main section").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    $("tab-" + b.dataset.tab).classList.add("active");
  };
});

// ---------- Chat ----------
const history = [];
function addMsg(role, text, typing) {
  const d = document.createElement("div");
  d.className = "msg " + (role === "user" ? "user" : "bot") + (typing ? " typing" : "");
  d.textContent = text;
  $("chatLog").appendChild(d);
  d.scrollIntoView({ behavior: "smooth", block: "end" });
  return d;
}
async function sendChat() {
  const t = $("chatInput").value.trim();
  if (!t) return;
  $("chatInput").value = "";
  addMsg("user", t);
  history.push({ role: "user", content: t });
  const typing = addMsg("bot", "بيفكر...");
  $("chatSend").disabled = true;
  try {
    const r = await fetch("/api/chat", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: history })
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || "خطأ في السيرفر");
    typing.remove();
    addMsg("bot", data.content || "(رد فاضي)");
    history.push({ role: "assistant", content: data.content || "" });
  } catch (e) {
    typing.textContent = "حصل خطأ: " + e.message;
    typing.classList.remove("typing");
  }
  $("chatSend").disabled = false;
}
$("chatSend").onclick = sendChat;
$("chatInput").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendChat(); }
});

// ---------- Generation (image / video / tts) ----------
async function submitRun(type, prompt, extra) {
  const r = await fetch("/api/run", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(Object.assign({ type, prompt }, extra || {}))
  });
  const data = await r.json();
  if (!r.ok || !data.id) throw new Error(data.error?.message || data.error || "فشل بدء التوليد");
  return data.id;
}
async function pollRun(id, onTick) {
  for (let i = 0; i < 120; i++) {
    await new Promise(r => setTimeout(r, 4000));
    const r = await fetch("/api/run?id=" + encodeURIComponent(id));
    const data = await r.json();
    if (onTick) onTick(data.status, i);
    if (data.status === "completed") {
      const out = (data.outputs || [])[0];
      if (!out || !out.url) throw new Error("مفيش نتيجة رجعت");
      return out.url;
    }
    if (data.status === "failed" || data.status === "timeout") {
      throw new Error(data.error?.message || "فشل التوليد، جرّب تاني");
    }
  }
  throw new Error("التوليد اخد وقت طويل، جرّب تاني");
}
function showResult(el, url, kind) {
  el.innerHTML = "";
  let node;
  if (kind === "image") { node = document.createElement("img"); node.src = url; node.alt = "الصورة المتولدة"; }
  else if (kind === "video") { node = document.createElement("video"); node.src = url; node.controls = true; node.playsInline = true; }
  else { node = document.createElement("audio"); node.src = url; node.controls = true; }
  el.appendChild(node);
  const a = document.createElement("a");
  a.className = "dl"; a.href = url; a.target = "_blank"; a.rel = "noopener";
  a.textContent = "فتح / تحميل الملف ↗";
  el.appendChild(a);
}
function wireGen(btnId, promptId, statusId, resultId, type, kind, extraFn) {
  $(btnId).onclick = async () => {
    const prompt = $(promptId).value.trim();
    if (!prompt) return;
    const st = $(statusId), res = $(resultId);
    st.className = "status"; res.innerHTML = "";
    $(btnId).disabled = true;
    st.textContent = "بيترفع الطلب...";
    try {
      const id = await submitRun(type, prompt, extraFn ? extraFn() : {});
      st.textContent = "بيشتغل... لحظات";
      const url = await pollRun(id, (s, i) => { st.textContent = "بيشتغل... " + (i + 1) * 4 + " ثانية (" + s + ")"; });
      st.textContent = "تم ✅";
      showResult(res, url, kind);
    } catch (e) {
      st.textContent = e.message;
      st.className = "status err";
    }
    $(btnId).disabled = false;
  };
}
wireGen("imgGo", "imgPrompt", "imgStatus", "imgResult", "image", "image");
wireGen("vidGo", "vidPrompt", "vidStatus", "vidResult", "video", "video");
wireGen("ttsGo", "ttsText", "ttsStatus", "ttsResult", "tts", "tts", () => ({ voice: $("ttsVoice").value, text: $("ttsText").value.trim() }));
</script>
</body>
</html>
